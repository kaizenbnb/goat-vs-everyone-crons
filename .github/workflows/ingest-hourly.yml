name: ingest-hourly
# Mismo patron que ingest-fast (ver ese archivo para el porque): job largo auto-solapado que
# tickea cada hora, porque los arranques `schedule:` de GitHub llegan de media cada ~4h, no cada
# hora. El job vive ~5h50 y refresca los 7 endpoints horarios una vez por hora; cancel-in-progress
# hace que un arranque nuevo releve al viejo sin huecos.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ingest-hourly
  cancel-in-progress: true

# actions:write solo para el relevo (workflow_dispatch de si mismo al final de la ventana).
permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: ingesta horaria (coingecko, bnb, news, pulse, stables, exchanges, terminal, regnews) + lentos cada 6 ticks · tick/1h ~5h50
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          : "${SITE_URL:?falta el secret SITE_URL}"
          : "${CRON_SECRET:?falta el secret CRON_SECRET}"

          INTERVAL=3600         # 1 h entre ticks
          WINDOW=20400          # ~5h40 de ticks; margen al timeout de 350 min
          ENDPOINTS="coingecko bnb news?pages=2 pulse stables exchanges terminal regnews"
          # Endpoints "lentos" (antes en ingest-6h.yml). El schedule de 6h de GitHub llegaba con
          # ~12h de retraso (nov-2026) y la home mostraba "syncing". Aqui van en el tick 1 de
          # cada arranque y luego cada 6 ticks (~6h): frescura <= 6h aunque GitHub se salte crons.
          SLOW_ENDPOINTS="leadership research listings mica"
          SLOW_EVERY=6

          end=$(( $(date +%s) + WINDOW ))
          ticks=0; ok=0; bad=0
          while :; do
            ticks=$((ticks + 1))
            echo "── tick $ticks · $(date -u '+%H:%M:%S')Z ──"
            eps="$ENDPOINTS"
            if [ $(( (ticks - 1) % SLOW_EVERY )) -eq 0 ]; then eps="$eps $SLOW_ENDPOINTS"; fi
            for ep in $eps; do
              code=$(curl -sS -m 320 -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$SITE_URL/api/ingest/$ep") || code=000
              if [ "$code" = "200" ]; then ok=$((ok + 1)); else bad=$((bad + 1)); fi
              echo "  $ep → $code"
            done
            [ $(( $(date +%s) + INTERVAL )) -ge "$end" ] && break
            sleep "$INTERVAL"
          done
          echo "── fin · $ticks ticks · $ok ok / $bad fallos ──"
          # No fallamos el job por errores transitorios de un endpoint (romperian la frescura).
          # Solo fallamos si NINGUN POST tuvo exito en toda la ventana (incidencia real).
          [ "$ok" -gt 0 ] || exit 1
      # Relevo: GitHub concede los arranques programados cada ~8h y la ventana dura ~5h40, lo que
      # dejaba huecos de 3-5h sin ingesta (medido nov-2026). Al cerrar la ventana, este job lanza
      # el siguiente: cadena continua. Si GitHub mata el job (cancel-in-progress por un arranque
      # nuevo), no se relanza: ya hay otro corriendo. Los schedules quedan como respaldo.
      - name: relevo · lanzar la siguiente ventana
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ingest-hourly.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
